services:
  frontend:
    build:
      context: .

    container_name: gamer_challenges_front

    ports:
      - "4000:3000"

    volumes:
      - .:/app
      - /app/node_modules

    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: true
      WATCHPACK_POLLING_INTERVAL: 1000

    restart: unless-stopped
